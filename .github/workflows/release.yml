name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and VERSION
        id: release
        shell: bash
        run: |
          version="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build, test and package
        run: |
          ./scripts/build/linux.sh
          ./tests/run_tests.sh
          ./scripts/checks/platforms.sh
          ./scripts/checks/docs.py
          ./scripts/release/build.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avelra-release-${{ github.ref_name }}
          path: build/releases/${{ steps.release.outputs.version }}
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: avelra-release-${{ github.ref_name }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          rel="release/linux-x64"
          test -f "$rel/manifest.json"
          cp "$rel/artifacts/"* "$rel/"
          (cd "$rel" && sha256sum -c SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" \
            "$rel/manifest.json" \
            "$rel/SHA256SUMS" \
            "$rel/artifacts/"*.tar.gz \
            "$rel/artifacts/"*.deb \
            --verify-tag \
            --title "Avelra ${version}" \
            --generate-notes
