name: ci-static

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nim
        run: ./scripts/ci/install-nim-linux.sh 2.2.12

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          mapfile -t files < <(find scripts tests -type f -name '*.sh' -print)
          test "${#files[@]}" -gt 0
          shellcheck --severity=warning "${files[@]}"

      - name: Secret scan
        run: ./scripts/ci/scan-secrets.sh

      - name: Nim checks
        run: ./scripts/checks/platforms.sh
