name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and VERSION
        id: release
        shell: bash
        run: |
          version="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build, test and package
        run: |
          ./scripts/build/linux.sh
          ./tests/run_tests.sh
          ./scripts/checks/platforms.sh
          ./scripts/checks/docs.py
          ./scripts/release/build.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avelra-release-${{ github.ref_name }}-linux-x64
          path: build/releases/${{ steps.release.outputs.version }}/linux-x64
          retention-days: 14
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and VERSION
        id: release
        shell: bash
        run: |
          version="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK
        shell: pwsh
        run: ./scripts/build/windows.ps1

      - name: Assemble release and NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          python scripts/release/assemble.py --target windows-x64 --commit "${{ github.sha }}"
          $version = (Get-Content VERSION -Raw).Trim()
          ./scripts/package/windows-nsis.ps1 -ReleaseDir "build/releases/$version/windows-x64"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avelra-release-${{ github.ref_name }}-windows-x64
          path: build/releases/${{ steps.release.outputs.version }}/windows-x64
          retention-days: 14
          if-no-files-found: error

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and VERSION
        id: release
        shell: bash
        run: |
          version="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build tools
        run: brew install cmake

      - name: Build SDK
        run: ./scripts/build/macos.sh

      - name: Assemble release and DMG
        run: |
          python3 scripts/release/assemble.py --target macos-arm64 --commit "${{ github.sha }}"
          version="$(cat VERSION)"
          ./scripts/package/macos-dmg.sh "build/releases/$version/macos-arm64"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avelra-release-${{ github.ref_name }}-macos-arm64
          path: build/releases/${{ steps.release.outputs.version }}/macos-arm64
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: avelra-release-${{ github.ref_name }}-*
          path: release
          merge-multiple: true

      - name: Verify and normalize manifests
        run: |
          for dir in release/*/; do
            test -f "$dir/manifest.json"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            target="$(basename "$dir")"
            cp "$dir/manifest.json" "release/manifest-${target}.json"
            cp "$dir/SHA256SUMS" "release/SHA256SUMS-${target}"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            release/manifest-*.json \
            release/SHA256SUMS-* \
            release/*/artifacts/* \
            --verify-tag \
            --title "Avelra ${version}" \
            --generate-notes
