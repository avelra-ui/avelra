name: npm-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.4.1
        required: true
      promote_only:
        description: Skip publish and only promote an already published version
        required: false
        type: boolean
        default: false

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag
        env:
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          test "${INPUTS_TAG#v}" = "$(cat VERSION)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Download release npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p npm
          gh release download "${INPUTS_TAG}" \
            --pattern 'avelra-*.tgz' \
            --pattern 'SHA256SUMS-npm' \
            --dir npm
          test -f "npm/avelra-${INPUTS_TAG#v}.tgz"
          test -f npm/SHA256SUMS-npm
          (cd npm && sha256sum -c SHA256SUMS-npm)

      - name: Install current npm for trusted publishing
        run: sudo npm install -g npm@11.6.0

      - name: Publish to npm with provenance
        if: ${{ !inputs.promote_only }}
        env:
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          npm publish "./npm/avelra-${INPUTS_TAG#v}.tgz" \
            --provenance --access public --tag next

      - name: Verify registry
        env:
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          version="${INPUTS_TAG#v}"
          for attempt in $(seq 1 30); do
            if npm view "avelra@${version}" version dist.tarball >/tmp/npm-view.txt 2>&1; then
              cat /tmp/npm-view.txt
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/npm-view.txt
              exit 1
            fi
            sleep 10
          done
          npm view avelra dist-tags

      - name: Smoke registry install
        env:
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          version="${INPUTS_TAG#v}"
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y >/dev/null
          npm install "avelra@${version}"
          ./node_modules/.bin/avelra --version
          ./node_modules/.bin/avelra init smoke
          cd smoke
          ../node_modules/.bin/avelra build
          test -x dist/smoke/smoke

      - name: Promote latest
        env:
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          version="${INPUTS_TAG#v}"
          npm dist-tag add "avelra@${version}" latest
          npm view avelra dist-tags
