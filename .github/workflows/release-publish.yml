name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, for example v0.1.0
        required: true
      run_id:
        description: Successful release workflow run id with the build artifact
        required: true

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download artifacts from the release run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_TAG: ${{ inputs.tag }}
          INPUTS_RUN_ID: ${{ inputs.run_id }}
        run: |
          test "${INPUTS_TAG#v}" = "$(cat VERSION)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          gh run download "${INPUTS_RUN_ID}" \
            --name "avelra-release-${INPUTS_TAG}" \
            --dir release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          rel="release/linux-x64"
          test -f "$rel/manifest.json"
          cp "$rel/artifacts/"* "$rel/"
          (cd "$rel" && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$rel/manifest.json" \
            "$rel/SHA256SUMS" \
            "$rel/artifacts/"*.tar.gz \
            "$rel/artifacts/"*.deb \
            --verify-tag \
            --title "Avelra ${version}" \
            --generate-notes
