name: test-system

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nim
        run: ./scripts/ci/install-nim-linux.sh 2.2.12
      - name: Build CLI
        run: |
          version="$(cat VERSION)"
          mkdir -p build/bin
          nim c -d:release --mm:orc --hints:off --path:src "-d:avelraVersion=$version" --out:build/bin/avelra src/bin/avelra_cli.nim
      - name: Install test dependency
        run: python3 -m pip install --user PyYAML
      - name: Run cli.version
        run: ./tests/run_tests.sh --case cli.version --provider ci-linux-x64

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nim
        shell: pwsh
        run: ./scripts/ci/install-nim-windows.ps1 2.2.12
      - name: Build CLI
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path build/bin | Out-Null
          nim c -d:release --mm:orc --hints:off --path:src "-d:avelraVersion=$version" --out:build/bin/avelra.exe src/bin/avelra_cli.nim
      - name: Install test dependency
        shell: pwsh
        run: python -m pip install PyYAML
      - name: Run cli.version
        shell: pwsh
        run: python tests/catalog/run-case.py --case cli.version --provider ci-windows-x64

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nim
        run: ./scripts/ci/install-nim-macos.sh 2.2.12
      - name: Build CLI
        run: |
          version="$(cat VERSION)"
          mkdir -p build/bin
          nim c -d:release --mm:orc --hints:off --path:src "-d:avelraVersion=$version" --out:build/bin/avelra src/bin/avelra_cli.nim
      - name: Install test dependency
        run: python3 -m pip install --user PyYAML
      - name: Run cli.version
        run: ./tests/run_tests.sh --case cli.version --provider ci-macos-x64
