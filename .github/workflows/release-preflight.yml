name: release-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build, test and package
        run: |
          ./scripts/build/linux.sh
          ./tests/run_tests.sh
          ./scripts/checks/platforms.sh
          ./scripts/checks/docs.py
          ./scripts/release/build.sh

      - name: Verify GLIBC baseline
        run: |
          version="$(cat VERSION)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "build/releases/${version}/linux-x64/artifacts/avelra-sdk-${version}-linux-x64.tar.gz" -C "$tmp"
          sdk="$tmp/avelra-sdk-${version}-linux-x64"
          ./scripts/checks/glibc.py --max 2.35 \
            "$sdk/bin/avelra" \
            "$sdk/libexec/avelra/avelra-runtime" \
            "$sdk/libexec/avelra/avelra-pack" \
            "$sdk/libexec/avelra/avelra-installer"

      - name: Upload preflight artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: avelra-release-preflight-${{ github.sha }}
          path: build/releases/*/linux-x64
          retention-days: 3
          if-no-files-found: error
