name: release-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nim
        run: ./scripts/ci/install-nim-linux.sh 2.2.12
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build, test and package
        run: |
          ./scripts/build/linux.sh
          ./tests/run_tests.sh
          ./scripts/checks/platforms.sh
          ./scripts/checks/docs.py
          ./scripts/release/build.sh

      - name: Verify GLIBC baseline
        run: |
          version="$(cat VERSION)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "build/releases/${version}/linux-x64/artifacts/avelra-${version}-linux-x64.tar.gz" -C "$tmp"
          sdk="$tmp/avelra-${version}-linux-x64"
          ./scripts/checks/glibc.py --max 2.35 \
            "$sdk/bin/avelra" \
            "$sdk/libexec/avelra/avelra-runtime" \
            "$sdk/libexec/avelra/avelra-pack" \
            "$sdk/libexec/avelra/avelra-installer"

      - name: Upload preflight artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: avelra-release-preflight-${{ github.sha }}
          path: build/releases/*/linux-x64
          retention-days: 3
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout RC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nim
        shell: pwsh
        run: ./scripts/ci/install-nim-windows.ps1 2.2.12
      - name: Build SDK
        shell: pwsh
        run: ./scripts/build/windows.ps1

      - name: Assemble release and NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          python scripts/release/assemble.py --target windows-x64 --commit "${{ github.sha }}"
          $version = (Get-Content VERSION -Raw).Trim()
          ./scripts/package/windows-nsis.ps1 -ReleaseDir "build/releases/$version/windows-x64"

      - name: Upload RC artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: avelra-rc-${{ github.sha }}-windows-x64
          path: build/releases/*/windows-x64
          retention-days: 14
          if-no-files-found: error

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout RC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install prebuilt Nim
        run: ./scripts/ci/install-nim-macos.sh 2.2.12

      - name: Install build tools
        run: brew install cmake

      - name: Build SDK
        run: ./scripts/build/macos.sh

      - name: Assemble release and DMG
        run: |
          python3 scripts/release/assemble.py --target macos-arm64 --commit "${{ github.sha }}"
          version="$(cat VERSION)"
          ./scripts/package/macos-dmg.sh "build/releases/$version/macos-arm64"

      - name: Upload RC artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: avelra-rc-${{ github.sha }}-macos-arm64
          path: build/releases/*/macos-arm64
          retention-days: 14
          if-no-files-found: error
