schema: 1
kind: avelra-test-cases
notes: Canonical test case catalog. Platform support is declared per case; execution profiles live in profiles/.
cases:
- id: INSTALL-TAR-001
  title: SDK tar unpack and checksum
  steps:
  - verify SHA256 against release SHA256SUMS
  - extract tar into a clean directory
  - check bin/avelra, libexec/avelra/avelra-runtime and share/avelra
  expected: files exist, checksum matches, no root-owned files in user tree
  automation: planned
  platforms:
  - linux
  runner: install.tar
  environment: vm
  target: supply
  level: integration
  aspect: compatibility
  technique: functional
  condition: normal
  requires:
  - guest
- id: INSTALL-TAR-002
  title: SDK tar without sudo
  steps:
  - extract as unprivileged user
  - run avelra --help
  - run avelra init in a temporary directory
  expected: works without sudo and without installed SDK
  automation: planned
  platforms:
  - linux
  runner: install.tar
  environment: vm
  target: supply
  level: integration
  aspect: compatibility
  technique: functional
  condition: normal
  requires:
  - guest
