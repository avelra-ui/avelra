schema_version: 1
cases:
  - schema_version: 1
    id: cli.version
    title: CLI prints version
    level: contract
    target: sdk
    aspect: behavior
    technique: functional
    condition: normal
    platforms: [linux-x64]
    requires: [cli-binary]
    runner: cli.command
    fixture: null
    timeout_s: 30
    steps:
      - run: avelra --version
    expected: exit code 0 and one version line
    assertions:
      - id: exit
        type: exit_code
        equals: 0
      - id: version
        type: stdout
        matches: "^avelra [0-9]+\\.[0-9]+\\.[0-9]+$"
