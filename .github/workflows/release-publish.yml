name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, for example v1.0.0
        required: true
      run_id:
        description: Successful release workflow run id with build artifacts
        required: true

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_TAG: ${{ inputs.tag }}
          INPUTS_RUN_ID: ${{ inputs.run_id }}
        run: |
          test "${INPUTS_TAG#v}" = "$(cat VERSION)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Download all platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_TAG: ${{ inputs.tag }}
          INPUTS_RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p release
          gh run download "${INPUTS_RUN_ID}" \
            --pattern "avelra-release-${INPUTS_TAG}-*" \
            --dir release
          for artifact in release/avelra-release-*; do
            test -d "$artifact"
            name="$(basename "$artifact")"
            target="${name#avelra-release-${INPUTS_TAG}-}"
            mv "$artifact" "release/$target"
          done
          for dir in release/*/; do
            test -f "$dir/manifest.json"
            cp "$dir/artifacts/"* "$dir/"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            target="$(basename "$dir")"
            cp "$dir/manifest.json" "release/manifest-${target}.json"
            {
              (cd release && sha256sum "manifest-${target}.json")
              (cd "$dir/artifacts" && sha256sum *)
            } > "release/SHA256SUMS-${target}"
          done

      - name: Build npm tarball
        run: |
          mkdir -p npm-input release/npm
          find release -path '*/artifacts/*' -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} npm-input/ \;
          ./scripts/package/npm-universal.sh "$PWD/npm-input" "$PWD/release/npm"
          (cd release/npm && sha256sum *.tgz) > release/SHA256SUMS-npm

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            release/manifest-*.json \
            release/SHA256SUMS-* \
            release/npm/*.tgz \
            release/*/artifacts/* \
            --verify-tag \
            --title "Avelra ${version}" \
            --generate-notes
