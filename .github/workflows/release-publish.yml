name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, for example v1.0.0
        required: true
      run_id:
        description: Successful release workflow run id with build artifacts
        required: true

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_TAG: ${{ inputs.tag }}
          INPUTS_RUN_ID: ${{ inputs.run_id }}
        run: |
          test "${INPUTS_TAG#v}" = "$(cat VERSION)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Download all platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_TAG: ${{ inputs.tag }}
          INPUTS_RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p release
          gh run download "${INPUTS_RUN_ID}" \
            --pattern "avelra-release-${INPUTS_TAG}-*" \
            --dir release
          for dir in release/*/; do
            test -f "$dir/manifest.json"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            target="$(basename "$dir")"
            cp "$dir/manifest.json" "release/manifest-${target}.json"
            cp "$dir/SHA256SUMS" "release/SHA256SUMS-${target}"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            release/manifest-*.json \
            release/SHA256SUMS-* \
            release/*/artifacts/* \
            --verify-tag \
            --title "Avelra ${version}" \
            --generate-notes
