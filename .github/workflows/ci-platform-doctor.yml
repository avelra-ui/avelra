name: ci-platform-doctor

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CLI and run doctor
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path build/bin | Out-Null
          nim c -d:release --mm:orc --hints:off --path:src "-d:avelraVersion=$version" --out:build/bin/avelra.exe src/bin/avelra_cli.nim
          ./build/bin/avelra.exe doctor

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install prebuilt Nim
        run: ./scripts/ci/install-nim-macos.sh 2.2.12
      - name: Build CLI and run doctor
        run: |
          version="$(cat VERSION)"
          mkdir -p build/bin
          nim c -d:release --mm:orc --hints:off --path:src "-d:avelraVersion=$version" --out:build/bin/avelra src/bin/avelra_cli.nim
          set +e
          ./build/bin/avelra doctor
          code=$?
          set -e
          if [ "$(uname -m)" = "arm64" ]; then
            test "$code" -eq 0
          else
            test "$code" -ne 0
          fi
